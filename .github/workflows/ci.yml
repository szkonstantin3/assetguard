name: AssetGuard CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Verify uv version
        run: uv --version

      - name: Validate dependency lock
        run: uv lock --check

      - name: Synchronize locked development dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Validate locked dependencies
        run: uv pip check

      - name: Run tests with coverage gate
        run: uv run --locked --no-sync python -m pytest -q --cov=assetguard --cov-report=term-missing --cov-fail-under=90

      - name: Smoke test module CLI
        run: |
          uv run --locked --no-sync python -m assetguard --help
          uv run --locked --no-sync python -m assetguard scan --help

      - name: Smoke test installed CLI
        run: |
          uv run --locked --no-sync assetguard --help
          uv run --locked --no-sync assetguard scan --help

  package-windows:
    name: Package (windows-latest, Python 3.13.9)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.9"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Verify uv version
        run: uv --version

      - name: Validate dependency lock
        run: uv lock --check

      - name: Synchronize locked packaging dependencies
        run: uv sync --locked --extra dev --extra build --python 3.13.9

      - name: Validate locked dependencies
        run: uv pip check

      - name: Build and prove repeatable release
        run: uv run --locked --no-sync python tools/build_windows_release.py --verify-reproducible

      - name: Validate packaged artifacts
        env:
          ASSETGUARD_PACKAGING_INTEGRATION: "1"
        run: uv run --locked --no-sync python -m pytest -q tests/test_windows_packaging.py
